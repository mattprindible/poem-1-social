[platformio]
default_envs = m5stick

[env]
platform = espressif32@6.12.0
framework = arduino
lib_deps =
    ; Resident as a dependency, not an in-tree symlink — this project lives
    ; outside a Resident checkout, so the upstream example's relative symlinks
    ; (../../.. and ../../m5stick-demo/...) cannot resolve. Same treatment as
    ; device/platformio.ini: track upstream main and pull with `pio pkg update`.
    git+https://github.com/inanimate-tech/resident.git#main
    ; The M5Stick drivers upstream shares from its m5stick-demo example are
    ; vendored under lib/drivers/ here, and picked up automatically by PlatformIO.
    ;
    ; Courier is deliberately NOT listed — Resident's library.json declares it
    ; and pulls the version it was tested against. Listing it here as a git dep
    ; too made PlatformIO install a second, separate copy. Same reasoning as
    ; device/platformio.ini.
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2
    ropg/ezTime@^0.8.3
    fischer-simon/Esp32Lua@^5.4.7
    m5stack/M5Unified
monitor_speed = 115200
; Resident headers use std::optional (C++17). arduino-espressif32 6.12
; defaults to gnu++11, so override at the env level.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM

[env:m5stick]
board = m5stick-c
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_flags =
    ${env.build_flags}
    -DBOARD_M5STICK_C_PLUS2

[env:m5sticks3]
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
; ── Upload port pinned ON PURPOSE — do not remove ────────────────────────────
; The M5StickS3 and the Poem/1 are both ESP32-S3s using the built-in USB
; JTAG/serial peripheral, so they enumerate with an IDENTICAL USB VID:PID
; (303A:1001) and differ only by MAC. With both plugged in, PlatformIO's
; auto-detect can pick EITHER — and picking wrong means flashing M5Stick
; firmware onto the Poem/1, whose reset would land with no e-ink quiesce
; (see sync.sh's flash-safety notes: an interrupted EPD waveform can damage
; the panel).
;
; Port numbering is assigned by the host, not the board, so this can go stale
; on a replug. VERIFY before flashing:
;     pio device list   # M5StickS3 = 70:04:1D:DA:53:48, Poem/1 = 94:A9:90:29:CF:FC
; and override for a one-off with:  pio run -e m5sticks3 -t upload --upload-port <p>
upload_port = /dev/cu.usbmodem1101
monitor_port = /dev/cu.usbmodem1101
lib_deps =
    ${env.lib_deps}
    M5PM1=https://github.com/m5stack/M5PM1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_M5STICKS3
