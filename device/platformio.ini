; Poem/1 — Resident sandbox (sandboxed Lua + hot reload over WebSocket).
;
; This project treats the Poem/1 as "just another ESP32 board": it depends on
; STOCK Resident (no fork, no core patches) and expresses the three board quirks
; — e-ink screen, hidden green LED, GPIO2 button — as Resident Driver subclasses
; in lib/drivers/ (see device/src/main.cpp). Hardware config proven in the
; poem-2/epd-test prototype (ED047TC1 e-ink via M5GFX, M5PaperS3-class).

[platformio]
default_envs = poem1

[env]
platform = espressif32@6.12.0
framework = arduino
lib_deps =
    ; Resident — track upstream main. Cached after first clone, so pull the
    ; latest with `pio pkg update` before a rebuild when you want to sync.
    ;
    ; Courier is deliberately NOT listed: Resident's library.json already
    ; declares it (`inanimate/courier`, from the registry), and listing it here
    ; as a git dep too made PlatformIO treat the two as different packages —
    ; installing both, and orphaning another copy on every version bump. Let
    ; Resident pull the version it was tested against; the two move together.
    git+https://github.com/inanimate-tech/resident.git#main
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.4.2
    ropg/ezTime@^0.8.3
    fischer-simon/Esp32Lua@^5.4.7
    m5stack/M5GFX@0.2.24
monitor_speed = 115200
; Resident headers use std::optional (C++17); arduino-espressif32 6.12 defaults
; to gnu++11, so override at the env level.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM

[env:poem1]
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = dio_opi   ; DIO flash + Octal PSRAM (ESP32-S3R8)
board_build.partitions = partitions.csv
; ── Upload port pinned ON PURPOSE — do not remove ────────────────────────────
; The Poem/1 and the M5StickS3 (see voice/device/platformio.ini) are both
; ESP32-S3s on the built-in USB JTAG/serial peripheral, so they enumerate with
; an IDENTICAL USB VID:PID (303A:1001) and differ only by MAC. sync.sh --flash
; runs `pio run -t upload` with no explicit port, so with both boards plugged
; in auto-detect could pick the wrong one — and a mistimed reset on THIS board
; is the e-ink damage sync.sh's whole quiesce dance exists to prevent.
;
; Port numbering is host-assigned, so this can go stale on a replug. VERIFY:
;     pio device list   # Poem/1 = 94:A9:90:29:CF:FC, M5StickS3 = 70:04:1D:DA:53:48
upload_port = /dev/cu.usbmodem101
monitor_port = /dev/cu.usbmodem101
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
